name: Update Frontend
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Destroy infrastructure'
        required: true
        type: boolean
        default: false
env: 
  AWS_REGION: us-east-1
permissions: 
  id-token: write
  contents: read
jobs:
  pre_test:
    if: github.event.inputs.destroy != 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: cache playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}    
      - name: install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: serve site locally
        run: python -m http.server 8000 --directory site &
      - name: run tests
        run: pytest tests/test_static.py --tracing=retain-on-failure
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/      
  build:
    needs: pre_test
    if: github.event.inputs.destroy != 'true'
    runs-on: ubuntu-latest
    outputs:
      cloudfront_url: ${{ steps.cf_url.outputs.url }}
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6
      - name: configure aws credentials for dev
        if: github.ref_name == 'dev'
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.SERVICE_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
      - name: configure aws credentials for prod
        if: github.ref_name == 'main'
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.PROD_SERVICE_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
      - name: Get API URL
        run: |
          API_URL=$(aws ssm get-parameter --name "/cloud_resume/api_url" --query "Parameter.Value" --output text)
          sed -i "s|PLACEHOLDER_API_URL|$API_URL|g" site/index.html
      - name: install Terraform
        uses: hashicorp/setup-terraform@v4.0.0
      - name: build with Terraform
        env:
          TF_VAR_route53_role_arn: ${{ github.ref_name == 'main' && secrets.ROUTE53_ROLE_ARN || '' }}
          TF_VAR_route53_zone_id: ${{ github.ref_name == 'main' && secrets.ROUTE53_ZONE_ID || '' }}
          TF_VAR_iam_role_arn: ${{ github.ref_name == 'main' && secrets.PROD_SERVICE_ROLE_ARN || secrets.SERVICE_ROLE_ARN }}
          TF_VAR_domain_aliases: ${{ github.ref_name == 'main' && '["gregoryeberwine.com"]' || '[]' }}
          STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.PROD_STATE_BUCKET || secrets.DEV_STATE_BUCKET }}
        run: |
          cd terraform
          terraform init -backend-config="bucket=${STATE_BUCKET}"
          terraform apply -auto-approve
      - name: upload to the bucket
        run: |
          aws s3 sync site/ s3://$(cd terraform && terraform output -raw s3_bucket_name)
      - name: invalidate cloudfront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $(cd terraform && terraform output -raw cloudfront_distribution_id) \
            --paths "/index.html" "/styles.css"
      - name: store cloudfront url in SSM
        run: |
          CF_URL=$(cd terraform && terraform output -raw cloudfront_distribution_url)
          if [ "${{ github.ref_name }}" = "main" ]; then
            CF_URL="https://gregoryeberwine.com"
          fi
          aws ssm put-parameter \
            --name "/cloud_resume/cloudfront_url" \
            --type "String" \
            --value "$CF_URL" \
            --overwrite
      - name: get cloudfront url
        id: cf_url
        run: echo "url=$(cd terraform && terraform output -raw cloudfront_distribution_url)" >> $GITHUB_OUTPUT
  post_test:
    needs: build
    if: github.event.inputs.destroy != 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: cache playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}  
      - name: install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: run tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.ref_name == 'main' && 'https://gregoryeberwine.com' || needs.build.outputs.cloudfront_url }}
        run: pytest tests/test_live.py --tracing=retain-on-failure
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
    destroy:
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
      runs-on: ubuntu-latest
      steps:
        - name: Git clone the repository
          uses: actions/checkout@v6
        - name: configure aws credentials for dev
          if: github.ref_name == 'dev'
          uses: aws-actions/configure-aws-credentials@v6.0.0
          with:
            role-to-assume: ${{ secrets.SERVICE_ROLE_ARN }}
            role-session-name: GitHub_to_AWS_via_FederatedOIDC
            aws-region: ${{ env.AWS_REGION }}
        - name: configure aws credentials for prod
          if: github.ref_name == 'main'
          uses: aws-actions/configure-aws-credentials@v6.0.0
          with:
            role-to-assume: ${{ secrets.PROD_SERVICE_ROLE_ARN }}
            role-session-name: GitHub_to_AWS_via_FederatedOIDC
            aws-region: ${{ env.AWS_REGION }}
        - name: install Terraform
          uses: hashicorp/setup-terraform@v4.0.0
        - name: destroy infrastructure
          env:
            TF_VAR_route53_role_arn: ${{ github.ref_name == 'main' && secrets.ROUTE53_ROLE_ARN || '' }}
            TF_VAR_route53_zone_id: ${{ github.ref_name == 'main' && secrets.ROUTE53_ZONE_ID || '' }}
            TF_VAR_iam_role_arn: ${{ github.ref_name == 'main' && secrets.PROD_SERVICE_ROLE_ARN || secrets.SERVICE_ROLE_ARN }}
            TF_VAR_domain_aliases: ${{ github.ref_name == 'main' && '["gregoryeberwine.com"]' || '[]' }}
            STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.PROD_STATE_BUCKET || secrets.DEV_STATE_BUCKET }}
          run: |
            cd terraform
            terraform init -backend-config="bucket=${STATE_BUCKET}"
            terraform destroy -auto-approve
            terraform destroy -auto-approve
