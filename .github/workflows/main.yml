name: Update Frontend
on:
  push:
    branches:
      - main
env: 
  AWS_REGION: us-east-1
permissions: 
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: arn:aws:iam::876762732886:role/GitHubAction-S3Upload
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
      - name: install Terraform
        uses: hashicorp/setup-terraform@v4.0.0
      - name: build with Terraform  
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
      - name: upload to the bucket
        run: |
          aws s3 sync site/ s3://$(cd terraform && terraform output -raw s3bucketname)
      - name: invalidate cloudfront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1VSCAY9O4JVUB \
            --paths "/index.html" "/styles.css"
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ensure browsers are installed
        run: python -m playwright install --with-deps
      - name: run tests
        run: pytest --tracing=retain-on-failure
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/         
